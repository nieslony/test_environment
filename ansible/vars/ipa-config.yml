ipadm_password: "{{ ipa.admin_password }}"
ipaadmin_password: "{{ ipa.admin_password }}"

ipaserver_domain: linux.lab
ipaserver_realm: LINUX.LAB
ipaserver_no_dnssec_validation: yes
ipaserver_setup_kra: yes
ipaserver_setup_dns: yes
ipaserver_setup_adtrust: yes

ipaserver_allow_zone_overlap: yes
ipaserver_auto_reverse: no
ipaserver_auto_forwarders: yes
ipaserver_no_host_dns: yes

ipareplica_domain: linux.lab
ipareplica_realm: LINUX.LAB
ipareplica_no_dnssec_validation: yes
ipareplica_auto_forwarders: yes
ipareplica_setup_ca: true
ipareplica_setup_kra: true
ipareplica_setup_dns: true
ipareplica_setup_adtrust: true

ipaclient_domain: linux.lab
ipaclient_force_join: yes
ipaclient_configure_firefox: yes
ipaclient_mkhomedir: yes
ipaclient_ssh_trust_dns: yes
ipaclient_subid: yes
ipasssd_enable_dns_updates: yes
